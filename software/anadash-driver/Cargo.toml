[package]
name = "anadash-driver"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
chrono = "0.4.45"
futures-util = "0.3.32"
heapless = "0.9.3"
mpris = "2.1.0"
sysinfo = "0.39.6"
tokio = {version = "1.38.0", features = ["full"] }
tokio-serial = "5.5.0"
zbus = "5.17.0"
shared = { path = "../shared" }
postcard = "1.1.3"
serde = "1.0.228"
map-arduino = "0.1.1"
env_logger = "0.11.11"
log = "0.4.33"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "benchmark"
harness = false

